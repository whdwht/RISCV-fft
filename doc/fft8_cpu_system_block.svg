<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">8点FFT加速器与CPU系统框图</title>
  <desc id="desc">Ibex CPU通过AHB-Lite访问8点FFT加速器和数据SRAM，并通过两次FFT8调用及软件合并完成16点FFT。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="cpuFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f0ff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
    <linearGradient id="fftFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f8ef"/>
      <stop offset="1" stop-color="#ccefdc"/>
    </linearGradient>
    <linearGradient id="memFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5d9"/>
      <stop offset="1" stop-color="#ffe8a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 34px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .box-title { font: 700 23px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .section-title { font: 700 19px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 600 14px "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; fill: #1e293b; }
      .arrow-label { font: 600 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1d4ed8; }
      .return-label { font: 600 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #c2410c; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <text x="800" y="51" text-anchor="middle" class="title">8点 FFT 加速器 + CPU 系统框图</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">内存映射协处理器：CPU 使用普通 sw/lw，经 AHB-Lite 发起计算并读取结果</text>

  <!-- CPU -->
  <g filter="url(#shadow)">
    <rect x="55" y="150" width="280" height="350" rx="22" fill="url(#cpuFill)" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="195" y="190" text-anchor="middle" class="box-title">Ibex RISC-V CPU</text>
  <line x1="80" y1="207" x2="310" y2="207" stroke="#93b4e8"/>
  <text x="85" y="240" class="section-title">软件控制</text>
  <text x="90" y="271" class="body">• sw：写入 8 个复数输入</text>
  <text x="90" y="300" class="body">• 第 8 次写入自动启动</text>
  <text x="90" y="329" class="body">• lw：读取 8 个 FFT 结果</text>
  <text x="90" y="358" class="body">• HREADY=0 时自动等待</text>
  <text x="85" y="401" class="section-title">FFT16 软件合并</text>
  <text x="90" y="432" class="body">• M 扩展整数乘法</text>
  <text x="90" y="461" class="body">• W₁₆ᵏ × O[k]</text>
  <text x="90" y="490" class="body">• X[k] = E[k] ± T[k]</text>

  <!-- Native to AHB bridge -->
  <g filter="url(#shadow)">
    <rect x="400" y="190" width="245" height="270" rx="18" fill="#f2edff" stroke="#7c3aed" stroke-width="2.5"/>
  </g>
  <text x="522" y="228" text-anchor="middle" class="box-title">sub_system</text>
  <text x="522" y="255" text-anchor="middle" class="small">CPU 数据接口 → AHB-Lite</text>
  <rect x="426" y="282" width="193" height="145" rx="11" fill="#ffffff" stroke="#b8a5e5"/>
  <text x="443" y="311" class="mono">data_req / data_gnt</text>
  <text x="443" y="338" class="mono">data_addr / data_we</text>
  <text x="443" y="365" class="mono">data_wdata / rdata</text>
  <text x="443" y="392" class="mono">data_rvalid</text>

  <!-- Fabric -->
  <g filter="url(#shadow)">
    <rect x="710" y="150" width="250" height="350" rx="22" fill="#e8f6ff" stroke="#0284c7" stroke-width="2.5"/>
  </g>
  <text x="835" y="190" text-anchor="middle" class="box-title">AHB-Lite 数据总线</text>
  <line x1="735" y1="207" x2="935" y2="207" stroke="#93c5d8"/>
  <text x="835" y="241" text-anchor="middle" class="section-title">地址译码</text>
  <rect x="743" y="264" width="184" height="73" rx="10" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="835" y="293" text-anchor="middle" class="mono">HADDR[31:28]</text>
  <text x="835" y="320" text-anchor="middle" class="body">选择 15 个从设备之一</text>
  <rect x="743" y="358" width="184" height="108" rx="10" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="760" y="388" class="mono">0x1... → m0 SRAM</text>
  <text x="760" y="419" class="mono">0x4... → m3 FFT8</text>
  <text x="760" y="450" class="small">返回 HRDATA/HREADY</text>

  <!-- FFT wrapper and core -->
  <g filter="url(#shadow)">
    <rect x="1025" y="108" width="520" height="455" rx="25" fill="url(#fftFill)" stroke="#059669" stroke-width="2.8"/>
  </g>
  <text x="1285" y="148" text-anchor="middle" class="box-title">FFT8 加速器（AHB 从机 m3）</text>
  <text x="1285" y="174" text-anchor="middle" class="small">建议访问窗口：0x4000_0000 ～ 0x4000_003C</text>

  <rect x="1055" y="201" width="187" height="153" rx="13" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="1148" y="230" text-anchor="middle" class="section-title">AHB 封装 fft8_top</text>
  <text x="1073" y="260" class="mono">+0x00..1C：输入</text>
  <text x="1073" y="287" class="mono">+0x20..3C：输出</text>
  <text x="1073" y="316" class="body">8 × 32-bit in_word</text>
  <text x="1073" y="342" class="small">{real[15:0], imag[15:0]}</text>

  <rect x="1055" y="379" width="187" height="143" rx="13" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="1148" y="408" text-anchor="middle" class="section-title">控制与握手</text>
  <text x="1073" y="438" class="mono">wr_last → start_r</text>
  <text x="1073" y="465" class="mono">done → valid</text>
  <text x="1073" y="492" class="mono">HREADY = valid</text>
  <text x="1073" y="514" class="small">仅读输出窗口时生效</text>

  <rect x="1282" y="201" width="225" height="321" rx="15" fill="#f0fdf4" stroke="#34d399" stroke-width="1.8"/>
  <text x="1394" y="232" text-anchor="middle" class="section-title">fft8_pl 三级流水核</text>
  <rect x="1310" y="257" width="169" height="57" rx="9" fill="#d1fae5" stroke="#10b981"/>
  <text x="1394" y="281" text-anchor="middle" class="body">Stage 1</text>
  <text x="1394" y="302" text-anchor="middle" class="small">4 个加/减蝶形</text>
  <line x1="1394" y1="315" x2="1394" y2="337" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="1310" y="342" width="169" height="57" rx="9" fill="#d1fae5" stroke="#10b981"/>
  <text x="1394" y="366" text-anchor="middle" class="body">Stage 2</text>
  <text x="1394" y="387" text-anchor="middle" class="small">4 蝶形，W₄=-j</text>
  <line x1="1394" y1="400" x2="1394" y2="422" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="1310" y="427" width="169" height="63" rx="9" fill="#d1fae5" stroke="#10b981"/>
  <text x="1394" y="451" text-anchor="middle" class="body">Stage 3</text>
  <text x="1394" y="474" text-anchor="middle" class="small">4 蝶形，W₈ Q10</text>
  <text x="1394" y="512" text-anchor="middle" class="small">12 个蝶形 / 8 个自然序输出</text>

  <!-- SRAM -->
  <g filter="url(#shadow)">
    <rect x="710" y="570" width="835" height="112" rx="20" fill="url(#memFill)" stroke="#d97706" stroke-width="2.4"/>
  </g>
  <text x="755" y="606" class="box-title">Data SRAM（AHB 从机 m0，0x1000_0000）</text>
  <text x="755" y="637" class="body">E[0..7] @ +0x00　│　O[0..7] @ +0x20　│　FFT16 最终结果 @ +0x40..+0xBC</text>
  <text x="755" y="664" class="small">CPU 暂存两次 FFT8 的输出，并把最终实部/虚部分别保存为 32 位有符号数</text>

  <!-- Main bus arrows -->
  <line x1="335" y1="272" x2="400" y2="272" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="367" y="253" text-anchor="middle" class="arrow-label">请求</text>
  <line x1="400" y1="386" x2="335" y2="386" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="367" y="411" text-anchor="middle" class="return-label">响应</text>

  <line x1="645" y1="272" x2="710" y2="272" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="678" y="253" text-anchor="middle" class="arrow-label">AHB</text>
  <line x1="710" y1="386" x2="645" y2="386" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="678" y="411" text-anchor="middle" class="return-label">读/等待</text>

  <line x1="960" y1="272" x2="1025" y2="272" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="992" y="253" text-anchor="middle" class="arrow-label">m3</text>
  <line x1="1025" y1="450" x2="960" y2="450" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="992" y="477" text-anchor="middle" class="return-label">结果</text>

  <line x1="835" y1="500" x2="835" y2="570" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="850" y="542" class="arrow-label">m0</text>

  <line x1="1242" y1="277" x2="1282" y2="277" stroke="#059669" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <text x="1262" y="258" text-anchor="middle" class="small">128b</text>
  <line x1="1282" y1="488" x2="1242" y2="488" stroke="#059669" stroke-width="2.8" marker-end="url(#arrowGreen)"/>

  <!-- Algorithm workflow panel -->
  <rect x="55" y="726" width="1490" height="258" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="765" class="box-title">使用一个 FFT8 核完成 FFT16：软件—硬件协同流程</text>

  <rect x="90" y="799" width="292" height="128" rx="16" fill="#e6f0ff" stroke="#60a5fa" stroke-width="1.8"/>
  <circle cx="121" cy="830" r="19" fill="#2563eb"/>
  <text x="121" y="836" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>
  <text x="151" y="836" class="section-title">偶数序列调用 FFT8</text>
  <text x="111" y="870" class="body">x[0], x[2], …, x[14]</text>
  <text x="111" y="900" class="body">硬件输出 E[0..7]</text>

  <line x1="382" y1="864" x2="423" y2="864" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="425" y="799" width="292" height="128" rx="16" fill="#e7f8ef" stroke="#34d399" stroke-width="1.8"/>
  <circle cx="456" cy="830" r="19" fill="#059669"/>
  <text x="456" y="836" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">2</text>
  <text x="486" y="836" class="section-title">奇数序列调用 FFT8</text>
  <text x="446" y="870" class="body">x[1], x[3], …, x[15]</text>
  <text x="446" y="900" class="body">硬件输出 O[0..7]</text>

  <line x1="717" y1="864" x2="758" y2="864" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="760" y="799" width="338" height="128" rx="16" fill="#fff5d9" stroke="#f59e0b" stroke-width="1.8"/>
  <circle cx="791" cy="830" r="19" fill="#d97706"/>
  <text x="791" y="836" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">3</text>
  <text x="821" y="836" class="section-title">CPU 计算旋转因子</text>
  <text x="781" y="870" class="body">T[k] = W₁₆ᵏ · O[k]</text>
  <text x="781" y="900" class="body">Q10 常数 + RISC-V mul</text>

  <line x1="1098" y1="864" x2="1139" y2="864" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="1141" y="799" width="368" height="128" rx="16" fill="#f2edff" stroke="#8b5cf6" stroke-width="1.8"/>
  <circle cx="1172" cy="830" r="19" fill="#7c3aed"/>
  <text x="1172" y="836" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">4</text>
  <text x="1202" y="836" class="section-title">CPU 完成最后一级蝶形</text>
  <text x="1162" y="870" class="body">X[k] = E[k] + T[k]</text>
  <text x="1162" y="900" class="body">X[k+8] = E[k] − T[k]</text>

  <text x="800" y="962" text-anchor="middle" class="small">蓝色：CPU 发出的地址/数据请求　　橙色：读数据与等待响应　　绿色：FFT 加速器内部数据流</text>
</svg>
