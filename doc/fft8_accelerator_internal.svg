<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1530" viewBox="0 0 1900 1530" role="img" aria-labelledby="title desc">
  <title id="title">FFT8加速器内部结构图</title>
  <desc id="desc">展示AHB-Lite封装、八个输入寄存器、启动与有效握手、三级FFT流水线、输出多路选择器和各级蝶形操作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="wrapperFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#e6f8ee"/>
    </linearGradient>
    <linearGradient id="coreFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#dff7fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172554" flood-opacity="0.13"/>
    </filter>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#2563eb"/>
    </marker>
    <marker id="orangeArrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#ea580c"/>
    </marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#059669"/>
    </marker>
    <marker id="purpleArrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 36px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .group-title { font: 700 25px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 15px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 600 13px "DejaVu Sans Mono", "Noto Sans Mono CJK SC", monospace; fill: #1e293b; }
      .formula { font: 600 15px "DejaVu Sans", "Noto Sans CJK SC", sans-serif; fill: #1e293b; }
      .signal-blue { font: 600 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1d4ed8; }
      .signal-orange { font: 600 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #c2410c; }
      .signal-green { font: 600 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #047857; }
      .signal-purple { font: 600 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #6d28d9; }
    </style>
  </defs>

  <rect width="1900" height="1530" fill="url(#bg)"/>
  <text x="950" y="49" text-anchor="middle" class="title">FFT8 加速器内部结构</text>
  <text x="950" y="80" text-anchor="middle" class="subtitle">fft8_top：AHB-Lite 寄存器封装　│　fft8_pl：全展开三级基-2 DIT 流水核　│　每个复数为 signed 16-bit 实部 + signed 16-bit 虚部</text>

  <!-- Whole accelerator wrapper -->
  <rect x="38" y="105" width="1824" height="850" rx="27" fill="url(#wrapperFill)" stroke="#059669" stroke-width="2.8"/>
  <text x="74" y="143" class="group-title">fft8_top：AHB-Lite 从设备封装</text>
  <text x="1818" y="143" text-anchor="end" class="small">pclk = sys_clk　│　preset = rstn（低有效）</text>

  <!-- AHB port -->
  <g filter="url(#shadow)">
    <rect x="70" y="204" width="218" height="605" rx="19" fill="#e6f0ff" stroke="#2563eb" stroke-width="2.2"/>
  </g>
  <text x="179" y="239" text-anchor="middle" class="box-title">AHB-Lite Slave Port</text>
  <line x1="92" y1="254" x2="266" y2="254" stroke="#93b4e8"/>
  <text x="96" y="287" class="signal-blue">CPU → FFT8</text>
  <text x="98" y="317" class="mono">HSEL</text>
  <text x="98" y="345" class="mono">HADDR[31:0]</text>
  <text x="98" y="373" class="mono">HTRANS[1:0]</text>
  <text x="98" y="401" class="mono">HWRITE</text>
  <text x="98" y="429" class="mono">HWDATA[31:0]</text>
  <text x="98" y="457" class="mono">HSIZE[2:0]</text>
  <line x1="92" y1="482" x2="266" y2="482" stroke="#93b4e8"/>
  <text x="96" y="516" class="signal-orange">FFT8 → CPU</text>
  <text x="98" y="546" class="mono">HRDATA[31:0]</text>
  <text x="98" y="574" class="mono">HREADY</text>
  <text x="98" y="602" class="mono">HRESP = OKAY</text>
  <line x1="92" y1="627" x2="266" y2="627" stroke="#93b4e8"/>
  <text x="98" y="661" class="body">32 位单拍访问</text>
  <text x="98" y="691" class="body">地址/控制相位</text>
  <text x="98" y="721" class="body">与写数据相位分离</text>
  <text x="98" y="763" class="small">没有中断或独立状态寄存器</text>

  <!-- Address phase registers -->
  <g filter="url(#shadow)">
    <rect x="337" y="171" width="248" height="151" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="461" y="202" text-anchor="middle" class="box-title">地址相位寄存器</text>
  <text x="361" y="235" class="mono">hsel_d0</text>
  <text x="361" y="260" class="mono">hwrite_d0</text>
  <text x="361" y="285" class="mono">htrans_d0, haddr_d0</text>
  <text x="361" y="310" class="small">仅在 HREADY=1 时更新</text>
  <line x1="288" y1="264" x2="337" y2="264" stroke="#2563eb" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="312" y="245" text-anchor="middle" class="signal-blue">地址/控制</text>

  <!-- Decode and write -->
  <g filter="url(#shadow)">
    <rect x="337" y="359" width="248" height="227" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="461" y="390" text-anchor="middle" class="box-title">写入译码与自动启动</text>
  <text x="359" y="424" class="mono">wr_in = sel &amp; write &amp; trans</text>
  <text x="359" y="454" class="mono">input_wr = wr_in &amp; !addr[5]</text>
  <text x="359" y="484" class="mono">index = addr[4:2]</text>
  <text x="359" y="521" class="formula">+0x00..+0x1C → lane 0..7</text>
  <text x="359" y="552" class="formula">写 +0x1C → wr_last = 1</text>
  <line x1="461" y1="322" x2="461" y2="359" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <path d="M288 421 H320 V474 H337" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="301" y="410" class="signal-blue">HWDATA</text>

  <!-- Input registers -->
  <g filter="url(#shadow)">
    <rect x="637" y="171" width="250" height="415" rx="18" fill="#fff7e6" stroke="#f59e0b" stroke-width="2.2"/>
  </g>
  <text x="762" y="203" text-anchor="middle" class="box-title">8 × 32-bit 输入寄存器</text>
  <text x="762" y="228" text-anchor="middle" class="mono">in_word[0..7]</text>
  <rect x="671" y="251" width="182" height="38" rx="7" fill="#ffffff" stroke="#f7c86a"/>
  <rect x="671" y="296" width="182" height="38" rx="7" fill="#ffffff" stroke="#f7c86a"/>
  <rect x="671" y="341" width="182" height="38" rx="7" fill="#ffffff" stroke="#f7c86a"/>
  <rect x="671" y="386" width="182" height="38" rx="7" fill="#ffffff" stroke="#f7c86a"/>
  <rect x="671" y="431" width="182" height="38" rx="7" fill="#ffffff" stroke="#f7c86a"/>
  <rect x="671" y="476" width="182" height="38" rx="7" fill="#ffffff" stroke="#f7c86a"/>
  <text x="762" y="276" text-anchor="middle" class="mono">lane 0 @ +0x00</text>
  <text x="762" y="321" text-anchor="middle" class="mono">lane 1 @ +0x04</text>
  <text x="762" y="366" text-anchor="middle" class="mono">lane 2 @ +0x08</text>
  <text x="762" y="411" text-anchor="middle" class="mono">lane 3 @ +0x0C</text>
  <text x="762" y="456" text-anchor="middle" class="mono">lane 4 @ +0x10</text>
  <text x="762" y="501" text-anchor="middle" class="mono">lane 5..7 @ +0x14..1C</text>
  <text x="762" y="541" text-anchor="middle" class="small">[31:16] 实部，[15:0] 虚部</text>
  <text x="762" y="566" text-anchor="middle" class="small">最后一项写入后整批锁定启动</text>
  <line x1="585" y1="474" x2="637" y2="474" stroke="#2563eb" stroke-width="3" marker-end="url(#blueArrow)"/>

  <!-- Pack into two wide buses -->
  <g filter="url(#shadow)">
    <rect x="932" y="240" width="168" height="182" rx="16" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="1016" y="271" text-anchor="middle" class="box-title">拆分并拼接</text>
  <text x="1016" y="305" text-anchor="middle" class="mono">in_re[127:0]</text>
  <text x="1016" y="334" text-anchor="middle" class="mono">in_im[127:0]</text>
  <text x="1016" y="371" text-anchor="middle" class="small">8 × signed 16-bit</text>
  <text x="1016" y="397" text-anchor="middle" class="small">所有 lane 并行送入</text>
  <line x1="887" y1="331" x2="932" y2="331" stroke="#2563eb" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="909" y="312" text-anchor="middle" class="signal-blue">256b</text>

  <!-- FFT pipeline core -->
  <rect x="1135" y="162" width="687" height="432" rx="22" fill="url(#coreFill)" stroke="#0891b2" stroke-width="2.5"/>
  <text x="1478" y="198" text-anchor="middle" class="group-title">fft8_pl：三级全展开流水核</text>
  <text x="1478" y="224" text-anchor="middle" class="small">每级 4 个 butterfly2；组合运算之间插入 128-bit 实部/虚部寄存器</text>

  <rect x="1158" y="279" width="66" height="92" rx="9" fill="#ffffff" stroke="#22c55e"/>
  <rect x="1243" y="269" width="90" height="112" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.7"/>
  <rect x="1352" y="279" width="66" height="92" rx="9" fill="#ffffff" stroke="#22c55e"/>
  <rect x="1437" y="269" width="90" height="112" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.7"/>
  <rect x="1546" y="279" width="66" height="92" rx="9" fill="#ffffff" stroke="#22c55e"/>
  <rect x="1631" y="269" width="90" height="112" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.7"/>
  <rect x="1740" y="279" width="60" height="92" rx="9" fill="#ffffff" stroke="#22c55e"/>
  <text x="1191" y="310" text-anchor="middle" class="mono">r0</text>
  <text x="1191" y="337" text-anchor="middle" class="small">输入</text>
  <text x="1191" y="360" text-anchor="middle" class="small">寄存</text>
  <text x="1288" y="305" text-anchor="middle" class="box-title">Stage 1</text>
  <text x="1288" y="333" text-anchor="middle" class="small">4 蝶形</text>
  <text x="1288" y="357" text-anchor="middle" class="small">纯加减</text>
  <text x="1385" y="310" text-anchor="middle" class="mono">r1</text>
  <text x="1385" y="344" text-anchor="middle" class="small">一级结果</text>
  <text x="1482" y="305" text-anchor="middle" class="box-title">Stage 2</text>
  <text x="1482" y="333" text-anchor="middle" class="small">4 蝶形</text>
  <text x="1482" y="357" text-anchor="middle" class="small">±j 旋转</text>
  <text x="1579" y="310" text-anchor="middle" class="mono">r2</text>
  <text x="1579" y="344" text-anchor="middle" class="small">二级结果</text>
  <text x="1676" y="305" text-anchor="middle" class="box-title">Stage 3</text>
  <text x="1676" y="333" text-anchor="middle" class="small">4 蝶形</text>
  <text x="1676" y="357" text-anchor="middle" class="small">W₈ Q10</text>
  <text x="1770" y="310" text-anchor="middle" class="mono">r3</text>
  <text x="1770" y="344" text-anchor="middle" class="small">输出</text>
  <line x1="1100" y1="325" x2="1158" y2="325" stroke="#059669" stroke-width="3" marker-end="url(#greenArrow)"/>
  <line x1="1224" y1="325" x2="1243" y2="325" stroke="#059669" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <line x1="1333" y1="325" x2="1352" y2="325" stroke="#059669" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <line x1="1418" y1="325" x2="1437" y2="325" stroke="#059669" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <line x1="1527" y1="325" x2="1546" y2="325" stroke="#059669" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <line x1="1612" y1="325" x2="1631" y2="325" stroke="#059669" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <line x1="1721" y1="325" x2="1740" y2="325" stroke="#059669" stroke-width="2.5" marker-end="url(#greenArrow)"/>

  <rect x="1274" y="439" width="402" height="111" rx="13" fill="#ffffff" stroke="#22c55e" stroke-width="1.6"/>
  <text x="1475" y="469" text-anchor="middle" class="box-title">有效位流水 vpipe[2:0]</text>
  <text x="1297" y="499" class="mono">vpipe &lt;= {vpipe[1:0], start}</text>
  <text x="1297" y="529" class="mono">done &lt;= vpipe[2]　（单周期脉冲）</text>

  <!-- Start control -->
  <g filter="url(#shadow)">
    <rect x="637" y="634" width="250" height="119" rx="16" fill="#f3efff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="762" y="666" text-anchor="middle" class="box-title">启动寄存器</text>
  <text x="762" y="700" text-anchor="middle" class="mono">start_r &lt;= wr_last</text>
  <text x="762" y="731" text-anchor="middle" class="small">打一拍，保证 lane 7 已写稳</text>
  <path d="M461 586 V693 H637" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#purpleArrow)"/>
  <text x="505" y="676" class="signal-purple">wr_last</text>
  <path d="M887 693 H1118 V516 H1274" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#purpleArrow)"/>
  <text x="1000" y="674" class="signal-purple">start</text>
  <path d="M1038 693 V407 H1191 V371" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#purpleArrow)"/>
  <text x="1048" y="430" class="signal-purple">start=1 时 r0&lt;=输入</text>

  <!-- Valid / ready -->
  <g filter="url(#shadow)">
    <rect x="923" y="656" width="264" height="181" rx="17" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  </g>
  <text x="1055" y="688" text-anchor="middle" class="box-title">结果有效与等待控制</text>
  <text x="949" y="723" class="mono">reset   → valid=0</text>
  <text x="949" y="752" class="mono">wr_last → valid=0</text>
  <text x="949" y="781" class="mono">done    → valid=1</text>
  <text x="949" y="815" class="formula">输出读：HREADY = valid</text>
  <path d="M1676 550 V621 H1148 V656" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="1390" y="611" class="signal-green">done</text>
  <path d="M585 552 H607 V770 H923" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#purpleArrow)"/>
  <text x="616" y="753" class="signal-purple">wr_last 清旧结果</text>

  <!-- Read mux -->
  <g filter="url(#shadow)">
    <rect x="1288" y="650" width="368" height="190" rx="17" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="1472" y="682" text-anchor="middle" class="box-title">输出选择器与读通道</text>
  <text x="1314" y="717" class="mono">rd_phase = read &amp; haddr_d0[5]</text>
  <text x="1314" y="748" class="mono">index = haddr_d0[4:2]</text>
  <text x="1314" y="783" class="formula">+0x20..+0x3C → output 0..7</text>
  <text x="1314" y="815" class="small">HRDATA={out_re[index],out_im[index]}</text>
  <path d="M1770 371 V620 H1568 V650" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="1678" y="610" class="signal-green">out_re/out_im：2 × 128b</text>

  <!-- Return signals -->
  <path d="M1288 742 H1220 V878 H288" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#orangeArrow)"/>
  <text x="1189" y="861" text-anchor="end" class="signal-orange">HRDATA[31:0]</text>
  <path d="M923 806 H895 V908 H288" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#orangeArrow)"/>
  <text x="868" y="895" text-anchor="end" class="signal-orange">HREADY：未完成时拉低，CPU 的 lw 自动停住</text>
  <path d="M337 295 H315 V908 H288" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="322" y="340" class="small">HREADY=0 时保持地址相位寄存器</text>

  <!-- Bottom left: stage mathematics -->
  <rect x="48" y="988" width="1140" height="492" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="1027" class="group-title">三级 FFT8 数据运算</text>

  <rect x="78" y="1054" width="1080" height="112" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="102" y="1083" class="box-title">Stage 1：按距离 4 配对，只有复数加减</text>
  <text x="102" y="1117" class="formula">a₀=x₀+x₄, a₁=x₀−x₄　│　a₂=x₂+x₆, a₃=x₂−x₆</text>
  <text x="102" y="1150" class="formula">a₄=x₁+x₅, a₅=x₁−x₅　│　a₆=x₃+x₇, a₇=x₃−x₇</text>

  <rect x="78" y="1182" width="1080" height="112" rx="14" fill="#ecfdf5" stroke="#34d399"/>
  <text x="102" y="1211" class="box-title">Stage 2：两个 4 点 FFT，−j 旋转通过交换与取负实现</text>
  <text x="102" y="1245" class="formula">b₀=a₀+a₂, b₂=a₀−a₂　│　b₁=a₁−j·a₃, b₃=a₁+j·a₃</text>
  <text x="102" y="1278" class="formula">b₄=a₄+a₆, b₆=a₄−a₆　│　b₅=a₅−j·a₇, b₇=a₅+j·a₇</text>

  <rect x="78" y="1310" width="1080" height="140" rx="14" fill="#f3efff" stroke="#8b5cf6"/>
  <text x="102" y="1339" class="box-title">Stage 3：合并成自然顺序 X[0..7]</text>
  <text x="102" y="1373" class="formula">X₀=b₀+b₄, X₄=b₀−b₄　│　X₁=b₁+W₈¹b₅, X₅=b₁−W₈¹b₅</text>
  <text x="102" y="1406" class="formula">X₂=b₂−j·b₆, X₆=b₂+j·b₆　│　X₃=b₃+W₈³b₇, X₇=b₃−W₈³b₇</text>
  <text x="102" y="1438" class="small">W₈¹≈(724−j724)/1024；W₈²=−j；W₈³≈(−724−j724)/1024</text>

  <!-- Bottom right: register map and timing -->
  <rect x="1217" y="988" width="635" height="492" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1250" y="1027" class="group-title">软件可见接口与数值特性</text>
  <rect x="1247" y="1054" width="575" height="133" rx="14" fill="#fff7e6" stroke="#f59e0b"/>
  <text x="1272" y="1083" class="box-title">MMIO 寄存器窗口</text>
  <text x="1272" y="1115" class="mono">0x4000_0000 + 4i：写 input[i]，i=0..7</text>
  <text x="1272" y="1146" class="mono">0x4000_0020 + 4i：读 output[i]，i=0..7</text>
  <text x="1272" y="1175" class="small">写 input[7] 自动启动；第一次输出读自动等待</text>

  <rect x="1247" y="1203" width="575" height="112" rx="14" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1272" y="1232" class="box-title">从最后输入写入到软件可读</text>
  <text x="1272" y="1264" class="mono">C0 写 lane7 → C1 r0 → C2 r1 → C3 r2 → C4 r3/done → C5 valid</text>
  <text x="1272" y="1295" class="small">核心计算为 3 级；外围另有 start_r 与 done→valid 寄存</text>

  <rect x="1247" y="1331" width="575" height="119" rx="14" fill="#f3efff" stroke="#8b5cf6"/>
  <text x="1272" y="1360" class="box-title">定点和溢出</text>
  <text x="1272" y="1392" class="body">• 所有输入、级间结果、输出分量均为 signed 16-bit</text>
  <text x="1272" y="1421" class="body">• 724 常数采用 Q10；负数除法按向零截断实现</text>
  <text x="1272" y="1448" class="body">• 加减没有饱和与缩放，超出 16 位时按补码回绕</text>
</svg>
